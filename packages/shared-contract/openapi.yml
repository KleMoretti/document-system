openapi: 3.1.0
info:
  title: Documentation Collaboration API
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Java backend
  - url: http://localhost:8081
    description: Go backend
paths:
  /api/auth/register:
    post:
      summary: Register a user
  /api/auth/login:
    post:
      summary: Login and return a JWT
  /api/me:
    get:
      summary: Return the authenticated user
  /api/documents:
    get:
      summary: List documents visible to the authenticated user
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Optional title search.
        - name: status
          in: query
          schema:
            type: string
            enum: [active, deleted]
            default: active
          description: List active documents by default or soft-deleted documents for recovery.
    post:
      summary: Create a document
  /api/documents/{docId}:
    get:
      summary: Get a document
    patch:
      summary: Rename a document
    delete:
      summary: Soft delete a document
  /api/documents/{docId}/restore:
    post:
      summary: Restore a soft-deleted document
  /api/documents/{docId}/versions:
    get:
      summary: List saved document versions
    post:
      summary: Save the current persisted Yjs update sequence as a document version
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
  /api/documents/{docId}/versions/{versionId}:
    get:
      summary: Get a saved document version and its base64 Yjs updates
  /api/documents/{docId}/versions/{versionId}/restore:
    post:
      summary: Restore persisted document updates from a saved version
  /api/documents/{docId}/comments:
    get:
      summary: List document comment threads
    post:
      summary: Create a document comment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
  /api/documents/{docId}/comments/{commentId}/replies:
    post:
      summary: Add a reply to a comment thread
  /api/documents/{docId}/comments/{commentId}:
    patch:
      summary: Update comment body or resolved state
  /api/documents/{docId}/shares:
    get:
      summary: List document shares
    post:
      summary: Share document with a user by email
  /api/documents/{docId}/shares/{userId}:
    delete:
      summary: Remove a user's access
